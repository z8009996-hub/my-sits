<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>موقعي الشخصي</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #1a1a2e;
            color: #ffffff;
            text-align: center;
            padding: 50px;
            margin: 0;
        }
        .card {
            background: #16213e;
            padding: 30px;
            border-radius: 15px;
            max-width: 400px;
            margin: 0 auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
        }
        h1 {
            color: #e94560;
        }
        p {
            color: #b2bec3;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>أهلاً بك يا زيد 🚀</h1>
        <p>تم رفع هذا الموقع بنجاح على الإنترنت عبر GitHub Pages!</p>
    </div>
</body>
</html>
